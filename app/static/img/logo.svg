<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pb-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C23" />
      <stop offset="100%" stop-color="#0E1015" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="pb-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0561E2" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0561E2" stop-opacity="0.1" />
    </linearGradient>

    <!-- Core Brand Gradient -->
    <linearGradient id="pb-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0561E2" />
      <stop offset="100%" stop-color="#0047BA" />
    </linearGradient>

    <!-- Pulse Glow Filter -->
    <filter id="pb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Canvas Badge -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#pb-bg-grad)" stroke="url(#pb-border-grad)" stroke-width="1.5" />

  <!-- Background Accent Mesh Lines -->
  <path d="M6 34 L42 34" stroke="#0561E2" stroke-opacity="0.12" stroke-width="1" />
  <path d="M14 6 L14 42" stroke="#0561E2" stroke-opacity="0.12" stroke-width="1" />

  <!-- Unique PARTBASE Monogram Symbol: Interconnected P-B Hexa-Node -->
  <g filter="url(#pb-glow)">
    <!-- Base Node Stem -->
    <rect x="14" y="11" width="5" height="26" rx="2.5" fill="url(#pb-brand-grad)" />

    <!-- Top Loop (P) -->
    <path d="M16.5 11 H27 C31.5 11 34.5 14 34.5 18 C34.5 22 31.5 25 27 25 H16.5 Z" 
          fill="url(#pb-brand-grad)" />
    <!-- Cutout for P inner eye -->
    <path d="M19 15.5 H26 C28.5 15.5 30 16.5 30 18 C30 19.5 28.5 20.5 26 20.5 H19 Z" 
          fill="#111317" />

    <!-- Lower Connected Loop & Base Arrow (B anchor) -->
    <path d="M16.5 24 H28.5 C33.5 24 36.5 27 36.5 31 C36.5 35 33.5 37 28.5 37 H16.5 Z" 
          fill="url(#pb-brand-grad)" />
    <!-- Cutout for B inner eye -->
    <path d="M19 28 H27.5 C29.8 28 31.5 29 31.5 30.5 C31.5 32 29.8 33 27.5 33 H19 Z" 
          fill="#111317" />

    <!-- Dynamic Lightning / Hyper-Local Radar Spark -->
    <circle cx="34.5" cy="18" r="2.2" fill="#00F0FF" />
    <circle cx="28.5" cy="37" r="1.8" fill="#00F0FF" />
  </g>
</svg>
