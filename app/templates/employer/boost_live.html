{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 text-center">
      <div class="lv-card p-4 p-md-5">
        <div class="mb-3">
          <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 72px; height: 72px; font-size: 2.2rem;">
            ✓
          </div>
        </div>

        <h2 class="fw-bold mb-2">Boost is live</h2>
        <p class="text-muted mb-4">
          <strong>{{ session.get('boosted_job_title', 'Your job') }}</strong> now shows first with an Urgent tag for 24 hours.
        </p>

        <a href="{{ url_for('employer.posts') }}" class="btn btn-lv-primary py-2 px-4 fw-bold">
          Back to job
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
