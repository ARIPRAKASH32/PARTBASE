{% extends 'base.html' %}

{% block content %}
<div class="container py-5 text-center">
  <div class="lv-card p-5 mx-auto" style="max-width: 520px;">
    <div class="stat-number mb-2 text-warning" style="font-size: 4rem;">403</div>
    <h3 class="fw-bold text-white mb-3">Access Restricted</h3>
    <p class="text-muted small mb-4">
      You do not have the required permissions or verified credentials to view this portal area.
    </p>
    <a href="{{ url_for('auth.landing') }}" class="btn btn-lv-primary px-4 fw-semibold">
      <i class="bi bi-house-door-fill me-1"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
