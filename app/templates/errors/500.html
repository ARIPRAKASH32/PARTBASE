{% extends 'base.html' %}

{% block content %}
<div class="container py-5 text-center">
  <div class="lv-card p-5 mx-auto" style="max-width: 520px;">
    <div class="stat-number mb-2 text-danger" style="font-size: 4rem;">500</div>
    <h3 class="fw-bold text-white mb-3">Server Exception Encountered</h3>
    <p class="text-muted small mb-4">
      An unexpected internal glitch occurred while processing this dispatch. Please refresh or contact the moderation desk.
    </p>
    <div class="d-flex justify-content-center gap-2">
      <a href="{{ url_for('auth.landing') }}" class="btn btn-lv-primary px-4 fw-semibold">
        <i class="bi bi-house-door-fill me-1"></i> Home
      </a>
      <a href="{{ url_for('support.support') }}" class="btn btn-lv-outline px-4 fw-semibold">
        <i class="bi bi-headset me-1"></i> Support Desk
      </a>
    </div>
  </div>
</div>
{% endblock %}
