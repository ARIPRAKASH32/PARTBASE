{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 text-center">
      <div class="lv-card p-4 p-md-5">
        <!-- Success Green Circle Check -->
        <div class="mb-3">
          <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 72px; height: 72px; font-size: 2.2rem;">
            ✓
          </div>
        </div>

        <h2 class="fw-bold mb-2">Applied!</h2>
        <p class="text-muted mb-4">
          <strong>{{ shop_name }}</strong> will call you soon. You can also call now.
        </p>

        <div class="d-grid gap-2 mb-3">
          {% if shop_phone %}
            <a href="tel:{{ shop_phone }}" class="btn btn-lv-success py-2 fw-bold">
              <i class="bi bi-telephone-fill me-1"></i> Call the shop
            </a>
          {% endif %}
          <a href="{{ url_for('seeker.jobs') }}" class="btn btn-lv-outline py-2 fw-semibold">
            See more jobs
          </a>
        </div>

        <a href="{{ url_for('seeker.applications') }}" class="text-decoration-none fw-semibold text-primary small">
          Track in Applied
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
