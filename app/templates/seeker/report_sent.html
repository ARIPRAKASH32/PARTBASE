{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 text-center">
      <div class="lv-card p-4 p-md-5">
        <div class="mb-3">
          <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 72px; height: 72px; font-size: 2.2rem;">
            ✓
          </div>
        </div>

        <h2 class="fw-bold mb-2">Thank you</h2>
        <p class="text-muted mb-4">
          Report <strong>{{ ticket_code }}</strong> sent. We review within 24 hours and update you in Support.
        </p>

        <div class="d-grid gap-2 mb-3">
          <a href="{{ url_for('seeker.jobs') }}" class="btn btn-lv-primary py-2 fw-bold">
            Back to jobs
          </a>
        </div>

        <a href="{{ url_for('support.support') }}" class="text-decoration-none fw-semibold text-primary small">
          View ticket in Support
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
